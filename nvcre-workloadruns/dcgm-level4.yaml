#
# Run:
#   nvcrectl workloadrun run --workload-registry nvcr.io \
#     --workload-registry-username '$oauthtoken' --workload-registry-password "$NGC_API_KEY" \
#     --wait dcgm-level4.yaml
# Report:
#   nvcrectl workloadrun report dcgm-level4
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: dcgm-level4
spec:
  image: nvcr.io/nvidia/cloud-native/dcgm:4.5.2-1-ubuntu22.04
  framework:
    exec:
      command: ["dcgmi"]
      args:
        - diag
        - --host
        - nvidia-dcgm.gpu-operator.svc:5555
        - --run
        - "4"
        - --json
        - --verbose
        - -p
        - targeted_power.test_duration=1200s
        - -p
        - targeted_stress.test_duration=1200s
        - -p
        - nvbandwidth.is_allowed=true
  numNodes: 1
  # Reduced from 8 -> 4: run:ai currently holds 3 GPUs on worker3 (reservation +
  # inference + pytorch pods), leaving only 5 of 8 allocatable free.
  gpusPerNode: 4
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
