# WorkloadRun: Nemotron 5 (8B) Megatron-LM training smoke test.
# Equivalent to Certification category training/nemotron5-8b.
#
# GROUND TRUTH: every value below (train.sh content, model shape flags,
# init container, volumes, env) was extracted verbatim from this cluster's
# own installed catalog via:
#   nvcrectl certification render <cert-file> --platform onprem --gpu-arch h100
# (rendered with --gpu-arch h100 since --gpu-arch b300 isn't yet accepted by
# the CLI; the base model shape flags -- num-layers/hidden-size/ffn-hidden-size/
# num-attention-heads/num-query-groups/kv-channels -- are architecture-independent,
# only NCCL tuning env and the TP default differ per architecture).
#
# Adjusted for this cluster:
#   - numNodes/gpusPerNode: 1 node x 8 GPUs (worker3, B300) instead of the
#     catalog's auto-detected node count.
#   - TENSOR_PARALLELISM=1: the catalog's parallelism table (meta.yaml) has no
#     explicit "b300" entry, so it falls back to "default: tp=1,pp=1" at
#     actual run time -- NOT h100's tp=2 used only for this render preview.
#   - Added HTTP_PROXY/HTTPS_PROXY/NO_PROXY: the megatron-clone init container
#     does `git clone` + `pip install`, which need the same proxy as the NCCL
#     tests' apt-get step.
#
# Run:
#   nvcrectl workloadrun run --workload-registry nvcr.io \
#     --workload-registry-username '$oauthtoken' --workload-registry-password "$NGC_API_KEY" \
#     --wait nemotron5-8b.yaml
# Report:
#   nvcrectl workloadrun report nemotron5-8b
apiVersion: nvcre.nvidia.com/v1alpha1
kind: WorkloadRun
metadata:
  name: nemotron5-8b
spec:
  image: nvcr.io/nvidia/pytorch:25.08-py3
  framework:
    exec:
      command: ["/bin/bash", "/config/train.sh"]
  numNodes: 8
  initContainers:
    - name: megatron-clone
      image: nvcr.io/nvidia/pytorch:25.08-py3
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -e
          src=/mnt/workspace/megatron-lm
          tmp=/mnt/workspace/.megatron-lm.tmp
          rm -rf "$tmp"
          if [ -d "$src" ]; then
            echo "Using pre-seeded workspace at $src"
          elif [ -d /opt/megatron-lm ]; then
            mkdir -p "$tmp"
            cp -a /opt/megatron-lm/. "$tmp"
            mv "$tmp" "$src"
            echo "Copied Megatron-LM from image at /opt/megatron-lm"
          else
            repo="https://github.com/NVIDIA/Megatron-LM.git"
            git clone --depth 1 -b core_v0.15.2 "$repo" "$tmp"
            mv "$tmp" "$src"
            echo "Cloned Megatron-LM from GitHub"
          fi
      env:
        - name: HTTP_PROXY
          value: "http://173.36.224.108:80/"
        - name: HTTPS_PROXY
          value: "http://173.36.224.108:80/"
        - name: NO_PROXY
          value: ".cluster.local,.lgsgpu.cisco.lab,.svc,10.128.0.0/14,10.20.66.0/24,127.0.0.1,172.17.26.0/23,172.30.0.0/16,api-int.lgsgpu.cisco.lab,localhost"
        - name: http_proxy
          value: "http://173.36.224.108:80/"
        - name: https_proxy
          value: "http://173.36.224.108:80/"
        - name: no_proxy
          value: ".cluster.local,.lgsgpu.cisco.lab,.svc,10.128.0.0/14,10.20.66.0/24,127.0.0.1,172.17.26.0/23,172.30.0.0/16,api-int.lgsgpu.cisco.lab,localhost"
      volumeMounts:
        - mountPath: /mnt/workspace
          name: workspace
  # No explicit /dev/shm volume/mount here -- the NVCRE controller auto-injects
  # its own "dshm" emptyDir+mount for every node job (confirmed via nccl-all-gather's
  # rendered Workflow), and adding our own caused a duplicate-mountPath validation
  # error that silently retry-looped the controller forever with the group stuck
  # Pending (no pod ever created). See chat history 2026-10-09.
  volumes:
    - name: workspace
      emptyDir:
        medium: Memory
  volumeMounts:
    - mountPath: /mnt/workspace
      name: workspace
  config:
    inline:
      train.sh: |
        #!/bin/bash
        set -e

        WORKSPACE_DIR=${WORKSPACE_DIR:-/mnt/workspace}
        MEGATRON_PATH=${MEGATRON_PATH:-${WORKSPACE_DIR}/megatron-lm}
        CHECKPOINT_DIR=${CHECKPOINT_DIR:-${WORKSPACE_DIR}/checkpoints}
        TENSORBOARD_DIR=${TENSORBOARD_DIR:-${WORKSPACE_DIR}/tensorboard}
        mkdir -p ${CHECKPOINT_DIR} ${TENSORBOARD_DIR}

        if ! ls ${MEGATRON_PATH}/megatron/core/datasets/helpers_cpp*.so 1>/dev/null 2>&1; then
          echo "Building Megatron helpers_cpp..."
          cd ${MEGATRON_PATH}
          pip install -e . --no-deps --no-build-isolation 2>&1 | tail -5
          cd ${WORKSPACE_DIR}
        fi

        CHECKPOINT_ARGS=""
        DATA_CACHE_ARGS=""
        if [ "$ENABLE_CHECKPOINT" = "true" ]; then
          CHECKPOINT_ARGS="--save ${CHECKPOINT_DIR}"
          if [ -d "${CHECKPOINT_DIR}" ] && [ "$(ls -A ${CHECKPOINT_DIR} 2>/dev/null)" ]; then
            CHECKPOINT_ARGS="${CHECKPOINT_ARGS} --load ${CHECKPOINT_DIR}"
          fi
          DATA_CACHE_ARGS="--data-cache-path ${WORKSPACE_DIR}/data_cache"
          mkdir -p ${WORKSPACE_DIR}/data_cache
        fi

        TOTAL_GPUS=$((PET_NNODES * PET_NPROC_PER_NODE))
        TP=${TENSOR_PARALLELISM:-1}
        PP=${PIPELINE_PARALLELISM:-1}
        MBS=${MICRO_BATCH_SIZE:-1}
        GBS=${GLOBAL_BATCH_SIZE:-$TOTAL_GPUS}

        echo "TOTAL_GPUS=${TOTAL_GPUS} GBS=${GBS} MBS=${MBS} TP=${TP} PP=${PP}"

        exec torchrun \
          --nnodes $PET_NNODES \
          --nproc-per-node $PET_NPROC_PER_NODE \
          ${MEGATRON_PATH}/pretrain_gpt.py \
          --attention-backend flash \
          --distributed-timeout-minutes 60 \
          --use-mcore-models \
          --no-mmap-bin-files \
          --sequence-parallel \
          --untie-embeddings-and-output-weights \
          --disable-bias-linear \
          --init-method-std 0.014 \
          --position-embedding-type rope \
          --rotary-base 1000000 \
          --rotary-percent 1.0 \
          --squared-relu \
          --group-query-attention \
          --kv-channels 128 \
          --normalization RMSNorm \
          --attention-dropout 0.0 \
          --hidden-dropout 0.0 \
          --exit-duration-in-mins ${EXIT_DURATION_MINS:-30} \
          --train-iters ${TRAIN_ITERS:-50} \
          --lr-decay-iters 1830030 \
          --lr 6e-4 \
          --min-lr 6e-6 \
          --weight-decay 0.1 \
          --clip-grad 1.0 \
          --lr-decay-style cosine \
          --lr-warmup-iters 5 \
          --eval-iters 1 \
          --eval-interval 50 \
          --log-interval 10 \
          --tokenizer-type NullTokenizer \
          --vocab-size 131072 \
          --mock-data \
          --num-workers 1 \
          --no-create-attention-mask-in-dataloader \
          --log-progress \
          --timing-log-option minmax \
          --log-params-norm \
          --log-num-zeros-in-grad \
          --log-throughput \
          --bf16 \
          --adam-beta1 0.9 \
          --adam-beta2 0.95 \
          --use-distributed-optimizer \
          --overlap-grad-reduce \
          --overlap-param-gather \
          --manual-gc \
          --log-straggler \
          --disable-straggler-on-startup \
          --straggler-minmax-count 16 \
          --check-weight-hash-across-dp-replicas-interval 20000 \
          --ckpt-fully-parallel-save \
          --ckpt-fully-parallel-load \
          --async-save \
          --ckpt-assume-constant-structure \
          --ckpt-format torch_dist \
          --num-layers 32 \
          --hidden-size 4096 \
          --ffn-hidden-size 21504 \
          --num-attention-heads 32 \
          --seq-length ${SEQ_LENGTH:-8192} \
          --max-position-embeddings ${SEQ_LENGTH:-8192} \
          --num-query-groups 8 \
          --tensor-model-parallel-size $TP \
          --pipeline-model-parallel-size $PP \
          --micro-batch-size $MBS \
          --global-batch-size $GBS \
          $CHECKPOINT_ARGS \
          $DATA_CACHE_ARGS \
          --save-interval ${SAVE_INTERVAL:-250} \
          --save-retain-interval ${SAVE_RETAIN_INTERVAL:-1000} \
          --tensorboard-dir ${TENSORBOARD_DIR}
  env:
    - name: NCCL_NVLS_ENABLE
      value: "0"
    - name: NVTE_FWD_LAYERNORM_SM_MARGIN
      value: "16"
    - name: NVTE_BWD_LAYERNORM_SM_MARGIN
      value: "16"
    - name: NVTE_FUSED_ATTN
      value: "0"
    - name: TORCHINDUCTOR_WORKER_START
      value: fork
    - name: CUDA_DEVICE_MAX_CONNECTIONS
      value: "1"
    - name: TORCH_NCCL_AVOID_RECORD_STREAMS
      value: "1"
    - name: TORCH_NCCL_HIGH_PRIORITY
      value: "1"
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: "expandable_segments:True"
    - name: TENSOR_PARALLELISM
      value: "1"
    - name: EXIT_DURATION_MINS
      value: "30"
    - name: ENABLE_CHECKPOINT
      value: "false"
    - name: TRAIN_ITERS
      value: "50"
    - name: SAVE_INTERVAL
      value: "250"
    - name: SAVE_RETAIN_INTERVAL
      value: "1000"
    - name: PYTHONPATH
      value: /mnt/workspace/megatron-lm
    - name: HTTP_PROXY
      value: "http://173.36.224.108:80/"
    - name: HTTPS_PROXY
      value: "http://173.36.224.108:80/"
    - name: NO_PROXY
      value: ".cluster.local,.lgsgpu.cisco.lab,.svc,10.128.0.0/14,10.20.66.0/24,127.0.0.1,172.17.26.0/23,172.30.0.0/16,api-int.lgsgpu.cisco.lab,localhost"
    - name: http_proxy
      value: "http://173.36.224.108:80/"
    - name: https_proxy
      value: "http://173.36.224.108:80/"
    - name: no_proxy
      value: ".cluster.local,.lgsgpu.cisco.lab,.svc,10.128.0.0/14,10.20.66.0/24,127.0.0.1,172.17.26.0/23,172.30.0.0/16,api-int.lgsgpu.cisco.lab,localhost"
  target:
    nodeSelector:
      nvidia.com/gpu.present: "true"
  goodputMeasurement:
    logProfileRef: megatron-training
    sampleInterval: 10s
