apiVersion: v1
data:
  train.sh: "#!/bin/bash\n# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.\n# SPDX-License-Identifier: Apache-2.0\n\nset -e\n# Fix ARP/RPF for multiple RoCE NICs on one subnet (prevents NCCL QP retry-exceeded)\nfor d in /proc/sys/net/ipv4/conf/*/; do\n  echo 1 > \"${d}arp_ignore\" 2>/dev/null || true\n  echo 2 > \"${d}arp_announce\" 2>/dev/null || true\n  echo 0 > \"${d}rp_filter\" 2>/dev/null || true\ndone\n\n# All paths via env vars\nWORKSPACE_DIR=${WORKSPACE_DIR:-/mnt/workspace}\nMEGATRON_PATH=${MEGATRON_PATH:-${WORKSPACE_DIR}/megatron-lm}\nCHECKPOINT_DIR=${CHECKPOINT_DIR:-${WORKSPACE_DIR}/checkpoints}\nTENSORBOARD_DIR=${TENSORBOARD_DIR:-${WORKSPACE_DIR}/tensorboard}\nmkdir -p ${CHECKPOINT_DIR} ${TENSORBOARD_DIR}\n\n# Build C++ helpers if not already compiled (needed for mock data)\nif ! ls ${MEGATRON_PATH}/megatron/core/datasets/helpers_cpp*.so 1>/dev/null 2>&1; then\n  echo \"Building Megatron helpers_cpp...\"\n  cd ${MEGATRON_PATH}\n  pip install -e . --no-deps --no-build-isolation 2>&1 | tail -5\n  cd ${WORKSPACE_DIR}\nfi\n\nCHECKPOINT_ARGS=\"\"\nDATA_CACHE_ARGS=\"\"\nif [ \"$ENABLE_CHECKPOINT\" = \"true\" ]; then\n  CHECKPOINT_ARGS=\"--save ${CHECKPOINT_DIR}\"\n  # Only load from checkpoint if one exists (skip on first run).\n  if [ -d \"${CHECKPOINT_DIR}\" ] && [ \"$(ls -A ${CHECKPOINT_DIR} 2>/dev/null)\" ]; then\n    CHECKPOINT_ARGS=\"${CHECKPOINT_ARGS} --load ${CHECKPOINT_DIR}\"\n  fi\n  DATA_CACHE_ARGS=\"--data-cache-path ${WORKSPACE_DIR}/data_cache\"\n  mkdir -p ${WORKSPACE_DIR}/data_cache\nfi\n\n# Dynamic computation \u2014 values from Go template at render time.TOTAL_GPUS=8\nTP=${TENSOR_PARALLELISM:-1}\nPP=${PIPELINE_PARALLELISM:-1}\nMBS=${MICRO_BATCH_SIZE:-1}\nGBS=${GLOBAL_BATCH_SIZE:-8}\n\necho \"TOTAL_GPUS=${TOTAL_GPUS} GBS=${GBS} MBS=${MBS} TP=${TP} PP=${PP}\"\n\nexec torchrun \\\n  --nnodes $PET_NNODES \\\n  --nproc-per-node $PET_NPROC_PER_NODE \\\n  --node-rank $PET_NODE_RANK \\\n  --master-addr $PET_MASTER_ADDR \\\n  --master-port $PET_MASTER_PORT \\\n  ${MEGATRON_PATH}/pretrain_gpt.py \\\n  --attention-backend flash \\\n  --distributed-timeout-minutes 60 \\\n  --use-mcore-models \\\n  --no-mmap-bin-files \\\n  --sequence-parallel \\\n  --untie-embeddings-and-output-weights \\\n  --disable-bias-linear \\\n  --init-method-std 0.014 \\\n  --position-embedding-type rope \\\n  --rotary-base 1000000 \\\n  --rotary-percent 1.0 \\\n  --squared-relu \\\n  --group-query-attention \\\n  --kv-channels 128 \\\n  --normalization RMSNorm \\\n  --attention-dropout 0.0 \\\n  --hidden-dropout 0.0 \\\n  --no-check-for-nan-in-loss-and-grad \\\n  --train-iters ${TRAIN_ITERS} \\\n  --lr-decay-iters 1830030 \\\n  --lr 6e-4 \\\n  --min-lr 6e-6 \\\n  --weight-decay 0.1 \\\n  --clip-grad 1.0 \\\n  --lr-decay-style cosine \\\n  --lr-warmup-iters 5 \\\n  --eval-iters 1 \\\n  --eval-interval 50 \\\n  --log-interval 1 \\\n  --tokenizer-type NullTokenizer \\\n  --vocab-size 131072 \\\n  --mock-data \\\n  --num-workers 1 \\\n  --no-create-attention-mask-in-dataloader \\\n  --log-progress \\\n  --timing-log-option minmax \\\n  --log-params-norm \\\n  --log-num-zeros-in-grad \\\n  --log-throughput \\\n  --bf16 \\\n  --adam-beta1 0.9 \\\n  --adam-beta2 0.95 \\\n  --use-distributed-optimizer \\\n  --overlap-grad-reduce \\\n  --overlap-param-gather \\\n  --manual-gc \\\n  --log-straggler \\\n  --disable-straggler-on-startup \\\n  --straggler-minmax-count 16 \\\n  --check-weight-hash-across-dp-replicas-interval 20000 \\\n  --ckpt-fully-parallel-save \\\n  --ckpt-fully-parallel-load \\\n  --async-save \\\n  --ckpt-assume-constant-structure \\\n  --ckpt-format torch_dist \\\n  --num-layers 32 \\\n  --hidden-size 4096 \\\n  --ffn-hidden-size 21504 \\\n  --num-attention-heads 32 \\\n  --seq-length ${SEQ_LENGTH:-8192} \\\n  --max-position-embeddings ${SEQ_LENGTH:-8192} \\\n  --num-query-groups 8 \\\n  --tensor-model-parallel-size $TP \\\n  --pipeline-model-parallel-size $PP \\\n  --micro-batch-size $MBS \\\n  --global-batch-size $GBS \\\n  ${RECOMPUTE_ARGS} \\\n  $CHECKPOINT_ARGS \\\n  $DATA_CACHE_ARGS \\\n  --save-interval ${SAVE_INTERVAL:-250} \\\n  --save-retain-interval ${SAVE_RETAIN_INTERVAL:-1000} \\\n  --tensorboard-dir ${TENSORBOARD_DIR}\n"
kind: ConfigMap
metadata:
  labels:
    app: nemotron5-8b
  name: nemotron5-8b-2node-config
  namespace: runai-cisco-team
---
# Headless Service -- gives each Indexed Job pod a stable DNS name
# (<job-name>-<index>.<service-name>.<namespace>.svc.cluster.local), used as the
# torchrun rendezvous master address without any extra CRD (replaces what
# TrainingRuntime/TrainJob would normally wire up for us).
apiVersion: v1
kind: Service
metadata:
  name: nemotron5-8b-2node
  namespace: runai-cisco-team
  labels:
    app: nemotron5-8b
spec:
  clusterIP: None
  selector:
    job-name: nemotron5-8b-2node
  ports:
    - name: c10d
      port: 29500
      targetPort: 29500
---
# Native batch/v1 Indexed Job -- no CRDs beyond what every Kubernetes/OpenShift
# cluster ships with. completions/parallelism: 2 == 2 training nodes; each pod gets
# JOB_COMPLETION_INDEX auto-injected by Kubernetes, used below as the torchrun node rank.
apiVersion: batch/v1
kind: Job
metadata:
  name: nemotron5-8b-2node
  namespace: runai-cisco-team
  labels:
    app: nemotron5-8b
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 30
  template:
    metadata:
      labels:
        app: nemotron5-8b
        job-name: nemotron5-8b-2node
      annotations:
        # scale-out tests' full-fabric exposure, so NCCL can select any of them.
        k8s.v1.cni.cncf.io/networks: '[{"name": "be-mac-vlan-network-eno6np0", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-eno7np0-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-eno8np0-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-eno9np0-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-eno10np0-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-eno11np0-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-eno12np0-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-eno13np0-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-ens1f1np1-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-ens2f1np1-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-ens4f1np1-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-ens5f1np1-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-ens6f1np1-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-ens7f1np1-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-ens9f1np1-runai-cisco-team", "namespace": "runai-cisco-team"},
          {"name": "be-mac-vlan-ens10f1np1-runai-cisco-team", "namespace": "runai-cisco-team"}]'
    spec:
      subdomain: nemotron5-8b-2node
      restartPolicy: OnFailure
      schedulerName: default-scheduler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app: nemotron5-8b
          maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      initContainers:
        - name: megatron-clone
          image: nvcr.io/nvidia/pytorch:25.08-py3
          command: ["/bin/bash", "-c"]
          args:
            - "set -e\nsrc=/mnt/workspace/megatron-lm\ntmp=/mnt/workspace/.megatron-lm.tmp\nrm -rf \"$tmp\"\nif [ -d \"$src\" ]; then\n  echo \"Using pre-seeded workspace at $src\"\nelif [ -d /opt/megatron-lm ]; then\n  mkdir -p \"$tmp\"\n  cp -a /opt/megatron-lm/. \"$tmp\"\n  mv \"$tmp\" \"$src\"\n  echo \"Copied Megatron-LM from image at /opt/megatron-lm\"\nelse\n  repo=\"https://github.com/NVIDIA/Megatron-LM.git\"\n  git clone --depth 1 -b core_v0.15.2 \"$repo\" \"$tmp\"\n  mv \"$tmp\" \"$src\"\n  echo \"Cloned Megatron-LM from the configured source repo\"\nfi\n"
          volumeMounts:
            - mountPath: /mnt/workspace
              name: workspace
      containers:
        - name: node
          image: nvcr.io/nvidia/pytorch:25.08-py3
          command: ["/bin/bash", "-c"]
          # JOB_COMPLETION_INDEX is auto-injected by Kubernetes for Indexed Jobs -- used
          # directly as the torchrun node rank, no CRD-templated PET_NODE_RANK needed.
          args:
            - "export PET_NODE_RANK=$JOB_COMPLETION_INDEX; exec /config/train.sh"
          env:
            - name: PET_NNODES
              value: '2'
            - name: PET_NPROC_PER_NODE
              value: '8'
            - name: PET_MASTER_ADDR
              value: nemotron5-8b-2node-0.nemotron5-8b-2node.runai-cisco-team.svc.cluster.local
            - name: PET_MASTER_PORT
              value: '29500'
            - name: NVTE_FWD_LAYERNORM_SM_MARGIN
              value: '16'
            - name: NVTE_BWD_LAYERNORM_SM_MARGIN
              value: '16'
            - name: NVTE_FUSED_ATTN
              value: '0'
            - name: TORCHINDUCTOR_WORKER_START
              value: fork
            - name: NCCL_DEBUG
              value: INFO
            - name: NCCL_DEBUG_SUBSYS
              value: NET,INIT,GRAPH,NVLS
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: NCCL_IB_TIMEOUT
              value: '19'
            - name: NCCL_P2P_NET_CHUNKSIZE
              value: '2097152'
            - name: NCCL_PXN_DISABLE
              value: '0'
            - name: NCCL_IB_DISABLE
              value: '0'
            - name: NCCL_CUMEM_ENABLE
              value: '1'
            - name: NCCL_NET_GDR_C2C
              value: '1'
            - name: NCCL_NET_GDR_LEVEL
              value: PHB
            - name: NCCL_MNNVL_ENABLE
              value: '0'
            - name: CUDA_DEVICE_MAX_CONNECTIONS
              value: '1'
            - name: TORCH_NCCL_AVOID_RECORD_STREAMS
              value: '1'
            - name: TORCH_NCCL_HIGH_PRIORITY
              value: '1'
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: UCX_MEM_MMAP_HOOK_MODE
              value: none
            - name: UCX_MEM_CUDA_HOOK_MODE
              value: none
            - name: UCX_MEM_MALLOC_HOOKS
              value: 'n'
            - name: UCX_ERROR_SIGNALS
              value: ''
            - name: EXIT_DURATION_MINS
              value: '0'
            - name: ENABLE_CHECKPOINT
              value: 'false'
            # Reduced from 1000000 to finish within ~15-20 min for a multi-node proof run.
            - name: TRAIN_ITERS
              value: '1500'
            # 16 (was 8) -- must be divisible by MBS(1) x DP size(16) now that we use
            # 8 GPUs/node x 2 nodes instead of 4 GPUs/node.
            - name: GLOBAL_BATCH_SIZE
              value: '16'
            - name: SAVE_INTERVAL
              value: '250'
            - name: SAVE_RETAIN_INTERVAL
              value: '1000'
            - name: PYTHONPATH
              value: /mnt/workspace/megatron-lm
            - name: PYTHONUNBUFFERED
              value: '1'
            # NCCL_IB_HCA intentionally removed -- let NCCL auto-discover and use every
            # RDMA NIC attached below, instead of pinning to a known-good subset.
            - name: NCCL_IB_GID_INDEX
              value: '5'
          resources:
            limits:
              cpu: '128'
              memory: 800Gi
              nvidia.com/gpu: '8'
              rdma/rdmashared: 8
            requests:
              cpu: '64'
              memory: 500Gi
              nvidia.com/gpu: '8'
          securityContext:
            privileged: true
          volumeMounts:
            - mountPath: /mnt/workspace
              name: workspace
            - mountPath: /dev/shm
              name: shmem
            - mountPath: /config
              name: training-config
      volumes:
        - emptyDir:
            medium: Memory
          name: workspace
        - emptyDir:
            medium: Memory
          name: shmem
        - configMap:
            defaultMode: 493
            name: nemotron5-8b-2node-config
          name: training-config
