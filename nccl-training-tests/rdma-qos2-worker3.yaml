apiVersion: v1
kind: Pod
metadata:
  name: rdma-qos2-worker3
  namespace: default
  labels:
    app: rdma-qos-test2
    role: client
  annotations:
    # Dynamic macvlan IP (whereabouts) on worker3 eno7np0 (0000:97:00.0 / mlx5_14)
    k8s.v1.cni.cncf.io/networks: |
      [{"name":"be-mac-vlan-network-eno7np0","namespace":"default"}]
spec:
  nodeSelector:
    kubernetes.io/hostname: worker3
  restartPolicy: Always
  containers:
    - name: rdma
      image: quay.io/edge-infrastructure/nvidia-tools:0.1.5
      securityContext:
        capabilities:
          add: ["IPC_LOCK", "SYS_RESOURCE", "NET_RAW", "NET_ADMIN"]
      resources:
        limits:
          rdma/rdmashared: 1
      command: ["bash", "-c"]
      args:
        - |
          set -u
          PORT=18516   # must match the pair-2 server port
          CANDIDATES="10.132.0.1 10.132.0.2 10.132.0.3 10.132.0.4 10.132.0.5 10.132.0.6"
          if ! command -v ib_write_bw >/dev/null 2>&1; then
            export http_proxy=http://proxy.esl.cisco.com:80 https_proxy=http://proxy.esl.cisco.com:80
            printf '[rk-app]\nname=rk-app\nbaseurl=http://dl.rockylinux.org/pub/rocky/9/AppStream/x86_64/os/\nenabled=1\ngpgcheck=0\n[rk-base]\nname=rk-base\nbaseurl=http://dl.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/\nenabled=1\ngpgcheck=0\n' > /etc/yum.repos.d/rk.repo
            dnf -y --disablerepo='*' --enablerepo='rk-app,rk-base' install perftest
            unset http_proxy https_proxy
          fi
          until ip -4 addr show net1 2>/dev/null | grep -q inet; do echo "waiting for net1"; sleep 2; done
          IP=$(ip -4 -o addr show net1 | awk '{print $4}' | cut -d/ -f1)
          DEV=$(show_gids | awk -v ip="$IP" '$5==ip && $6=="v2"{print $1; exit}')
          echo "PAIR2 CLIENT net1=$IP rdma-dev=$DEV port=$PORT (bidir -b, no --tos) - connecting to pair-2 server on port $PORT"
          # Connect-based discovery: only the pair-2 server listens on $PORT, so wrong candidates fail fast.
          while true; do
            for cand in $CANDIDATES; do
              [ "$cand" = "$IP" ] && continue
              echo "trying $cand:$PORT"
              ib_write_bw -d "$DEV" -R -F --report_gbits -q 2 -b -p "$PORT" --run_infinitely "$cand" && break
            done
            echo "no pair-2 server reachable on port $PORT yet; retrying in 3s"; sleep 3
          done
